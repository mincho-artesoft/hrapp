<div class="auth-card">
  <div class="auth-card__glow" aria-hidden="true"></div>

  <span class="auth-card__badge">{{ badgeText }}</span>
  <h2 class="auth-card__title">{{ title }}</h2>
  <p class="auth-card__sub">{{ subtitle }}</p>

  @if (errorMsg()) {
    <div class="auth-alert auth-alert--error" role="alert">
      {{ errorMsg() }}
    </div>
  }

  @if (infoMsg()) {
    <div class="auth-alert auth-alert--info" role="status">
      {{ infoMsg() }}
    </div>
  }

  @if (step() === 'method') {
    <div class="oauth-grid">
      <button
        type="button"
        class="oauth-btn"
        [disabled]="busy()"
        (click)="onGoogleClick()"
      >
        <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
          <path fill="#EA4335" d="M12 10.2v3.9h5.5c-.24 1.26-.97 2.33-2.06 3.05l3.33 2.58c1.94-1.79 3.06-4.43 3.06-7.56 0-.73-.07-1.43-.19-2.1H12z"/>
          <path fill="#34A853" d="M12 22c2.77 0 5.1-.92 6.8-2.49l-3.33-2.58c-.92.62-2.1.99-3.47.99-2.67 0-4.93-1.8-5.74-4.22H2.82v2.66A10 10 0 0 0 12 22z"/>
          <path fill="#4A90E2" d="M6.26 13.7A6.02 6.02 0 0 1 5.94 12c0-.59.11-1.16.32-1.7V7.64H2.82A10 10 0 0 0 2 12c0 1.61.39 3.14 1.08 4.36l3.18-2.66z"/>
          <path fill="#FBBC05" d="M12 5.98c1.5 0 2.85.52 3.91 1.53l2.93-2.93C17.09 2.94 14.77 2 12 2A10 10 0 0 0 2.82 7.64l3.44 2.66C7.07 7.78 9.33 5.98 12 5.98z"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <button
        type="button"
        class="oauth-btn"
        [disabled]="busy()"
        (click)="onMicrosoftClick()"
      >
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <rect x="2" y="2" width="9.2" height="9.2" fill="#F25022" rx="1"/>
          <rect x="12.8" y="2" width="9.2" height="9.2" fill="#7FBA00" rx="1"/>
          <rect x="2" y="12.8" width="9.2" height="9.2" fill="#00A4EF" rx="1"/>
          <rect x="12.8" y="12.8" width="9.2" height="9.2" fill="#FFB900" rx="1"/>
        </svg>
        <span>Continue with Microsoft</span>
      </button>
    </div>

    <div class="auth-sep">
      <span>or instant verified email code</span>
    </div>

    <form class="auth-form" (ngSubmit)="sendCode()">
      <label class="auth-field">
        <span>Work or personal email</span>
        <input
          type="email"
          name="email"
          autocomplete="email"
          placeholder="you@company.com"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          required
        />
      </label>

      <label class="auth-field">
        <span>Display name <em>(optional)</em></span>
        <input
          type="text"
          name="displayName"
          autocomplete="name"
          placeholder="Alex Morgan"
          [ngModel]="displayName()"
          (ngModelChange)="displayName.set($event)"
        />
      </label>

      <button type="submit" class="btn btn--primary auth-submit" [disabled]="busy()">
        {{ busy() ? 'Sending 6-digit code…' : 'Send 6-Digit Verification Code →' }}
      </button>
    </form>

    @if (allowSandbox) {
      <div class="sandbox-row">
        <button type="button" class="sandbox-btn" [disabled]="busy()" (click)="startSandbox()">
          Try interactive Web Calendar right now without signing in →
        </button>
      </div>
    }
  } @else {
    <form class="auth-form" (ngSubmit)="verifyCode()">
      <label class="auth-field">
        <span>6-digit verification code</span>
        <input
          type="text"
          name="otp"
          inputmode="numeric"
          autocomplete="one-time-code"
          maxlength="6"
          placeholder="123456"
          class="otp-input"
          [ngModel]="code()"
          (ngModelChange)="code.set($event)"
          required
        />
      </label>

      <button type="submit" class="btn btn--primary auth-submit" [disabled]="busy()">
        {{ busy() ? 'Verifying…' : 'Verify & Open Workspace →' }}
      </button>

      <div class="code-actions">
        <button type="button" class="text-link" [disabled]="busy()" (click)="sendCode()">
          Resend code
        </button>
        <button type="button" class="text-link" [disabled]="busy()" (click)="backToEmail()">
          Use another email or provider
        </button>
      </div>
    </form>
  }
</div>
