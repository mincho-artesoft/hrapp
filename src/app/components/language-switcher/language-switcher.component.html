<details class="lang" #panel>
  <summary class="lang__btn" [attr.aria-label]="label()">
    <svg class="lang__globe" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6" />
      <path
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.7-3.8-9s1.3-6.4 3.8-9z"
      />
    </svg>
    <span class="lang__code">{{ current().hreflang }}</span>
  </summary>

  <ul class="lang__menu">
    @for (o of options(); track o.locale.code) {
      <li>
        <a
          [href]="o.href"
          [attr.lang]="o.locale.hreflang"
          [attr.dir]="o.locale.dir"
          [attr.aria-current]="o.locale.code === current().code ? 'true' : null"
          [class.is-current]="o.locale.code === current().code"
          >{{ o.locale.label }}</a
        >
      </li>
    }
  </ul>
</details>
