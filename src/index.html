<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>Cloud Calendars — your calendar and the weather, in one view</title>
  <meta name="description" content="Unify iCloud, Google Calendar and Microsoft in one iPhone app, with hourly forecasts built into every day, Home Screen widgets and Live Activities. Free on the App Store." />
  <meta name="theme-color" content="#04060f" />
  <meta name="color-scheme" content="dark" />
  <link rel="canonical" href="https://www.cloud-calendars.com/" />

  <!-- Social cards -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Cloud Calendars" />
  <meta property="og:title" content="Cloud Calendars — your calendar and the weather, in one view" />
  <meta property="og:description" content="iCloud, Google and Microsoft calendars in one place, with the forecast built into every day." />
  <meta property="og:url" content="https://www.cloud-calendars.com/" />
  <meta property="og:image" content="https://www.cloud-calendars.com/assets/images/app-screenshots/single-day-view.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Apple -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-itunes-app" content="app-id=6744690319" />

  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />

  <!-- Fonts are self-hosted and bundled with the stylesheet — no third-party request. -->

  <!-- The hero screenshot is the largest contentful paint on a wide viewport,
       so start it early there. On a phone the hero stacks and this image sits
       about 850px down — below a 745px fold — where a high-priority preload
       only competes with the bundle for bandwidth and moves LCP nowhere.
       Measured: LCP on mobile is text, at 596ms. -->
  <link rel="preload" as="image" href="assets/images/app-screenshots/single-day-view.webp"
        fetchpriority="high" media="(min-width: 900px)" />

  <!-- SoftwareApplication data is generated from app-facts.ts on home pages. -->

  <!-- The FAQPage markup is emitted by faq.component.ts, per language, from
       the same object the section renders. It used to be hand-copied here;
       when the FAQ was translated the copy stayed English, so twenty-nine
       pages carried English markup over translated prose. Generating it from
       the one source is the only arrangement where that cannot recur. -->

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YESHVTRYB1"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-YESHVTRYB1');
  </script>

  <style>
    /* Inline boot styles so there is never a white flash before the
       stylesheet and the app bundle arrive. */
    html { background: #03050c; }
    body { margin: 0; background: #03050c; }

    .boot {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #03050c;
      z-index: 99999;
      transition: opacity 0.6s ease, visibility 0.6s;
    }
    .boot--gone { opacity: 0; visibility: hidden; }

    .boot__mark {
      width: 52px;
      height: 52px;
      filter: drop-shadow(0 0 60px rgba(80, 120, 255, 0.75));
      animation: boot-pulse 1.4s cubic-bezier(0.65, 0, 0.35, 1) infinite alternate;
    }

    @keyframes boot-pulse {
      from { transform: scale(0.86); opacity: 0.55; }
      to   { transform: scale(1); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .boot__mark { animation: none; }
    }
  </style>
</head>

<body>
  <div class="boot" id="boot"><img class="boot__mark" src="icons/mark-128.webp" alt="" width="52" height="52" /></div>

  <app-root></app-root>

  <script>
    // Remove the boot screen once Angular has rendered something.
    (function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      var done = function () {
        boot.classList.add('boot--gone');
        setTimeout(function () { boot.remove(); }, 700);
      };
      var observer = new MutationObserver(function () {
        if (document.querySelector('app-root main')) { observer.disconnect(); done(); }
      });
      observer.observe(document.body, { childList: true, subtree: true });
      setTimeout(done, 4000); // hard fallback
    })();
  </script>
</body>
</html>
