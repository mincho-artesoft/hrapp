  <!-- The hero screenshot is the largest contentful paint on a wide viewport,
       so start it early there. On a phone the hero stacks and this image sits

       Measured: LCP on mobile is text, at 596ms. -->

        fetchpriority="high" media="(min-width: 900px)" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Cloud Calendars",
    "operatingSystem": "iOS 18.0 or later",
    "applicationCategory": "ProductivityApplication",
    "downloadUrl": "https://apps.apple.com/us/app/cloud-calendars/id6744690319",

    "fileSize": "30.3 MB",

    "author": { "@type": "Organization", "name": "Arte Soft Ltd." },
    "aggregateRating": { "@type": "AggregateRating", "ratingValue": "4.3", "ratingCount": "7" },
    "offers": [
      { "@type": "Offer", "price": "0", "priceCurrency": "USD", "name": "Free" },

  }

  <!-- The FAQ section, marked up so an answer engine can quote it directly.
       Generated from faq.component.ts, which is the only copy of these
       strings — Google requires the marked-up answer to match the visible
       one, and hand-copying them is how that quietly stops being true. -->
  <script type="application/ld+json">
  {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
          {
              "@type": "Question",
              "name": "Do I need an account to use Cloud Calendars?",
              "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. The app reads the calendars already on your iPhone through Apple’s own EventKit, so iCloud works the moment you grant permission. You only sign in to Google or Microsoft if you want those calendars in there too."
              }
          },
          {
              "@type": "Question",
              "name": "Is Google Calendar sync really free?",
              "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Google sync, every calendar view, the complete weather hub, all the Home Screen widgets and Google Meet links are in the free tier. Advanced removes ads and adds cross-calendar management; Premium adds Microsoft."
              }
          },
          {
              "@type": "Question",
              "name": "Where does the weather data come from?",
              "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Forecasts are fetched for your current or chosen location and cover hourly and ten-day outlooks, feels-like temperature, precipitation, UV, wind and gusts, humidity and dew point, visibility, pressure, sunrise and sunset, and moon phase."
              }
          },
          {
              "@type": "Question",
              "name": "Can I change an event by dragging it?",
              "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "That is the main way to edit. Drag an event to another time or another day, or pull its top or bottom edge to change the duration. Changes sync straight back to the source calendar."
              }
          },
          {
              "@type": "Question",
              "name": "What do the widgets show?",
              "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Three sizes. Small gives the date with the current condition and temperature. Medium adds conditions, moon phase and wind direction. Large puts your next few events beside the forecast. A Live Activity counts down to your next event."
              }
          },
          {
              "@type": "Question",
              "name": "Which devices are supported?",
              "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "iPhone and iPad running iOS 18 or later. The app is about 30 MB."
              }
          },
          {
              "@type": "Question",
              "name": "How do I cancel a subscription?",
              "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Subscriptions are handled by Apple, so you cancel in your App Store account settings. Do it at least 24 hours before the period ends and you will not be charged again."
              }
          }
      ]
  }
  </script>

  <style>
    /* Inline boot styles so there is never a white flash before the
       stylesheet and the app bundle arrive. */
    html { background: #03050c; }
    body { margin: 0; background: #03050c; }

    .boot {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #03050c;
      z-index: 99999;
      transition: opacity 0.6s ease, visibility 0.6s;
    }
    .boot--gone { opacity: 0; visibility: hidden; }

    .boot__mark {
      width: 52px;
      height: 52px;
      filter: drop-shadow(0 0 60px rgba(80, 120, 255, 0.75));
      animation: boot-pulse 1.4s cubic-bezier(0.65, 0, 0.35, 1) infinite alternate;
    }

    @keyframes boot-pulse {
      from { transform: scale(0.86); opacity: 0.55; }
      to   { transform: scale(1); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .boot__mark { animation: none; }
    }
  </style>
</head>

<body>
  <div class="boot" id="boot"><img class="boot__mark" src="icons/mark-128.webp" alt="" width="52" height="52" /></div>

  <app-root></app-root>

  <script>
    // Remove the boot screen once Angular has rendered something.
    (function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      var done = function () {
        boot.classList.add('boot--gone');
        setTimeout(function () { boot.remove(); }, 700);
      };
      var observer = new MutationObserver(function () {
        if (document.querySelector('app-root main')) { observer.disconnect(); done(); }
      });
      observer.observe(document.body, { childList: true, subtree: true });
      setTimeout(done, 4000); // hard fallback
    })();
  </script>
</body>
</html>
