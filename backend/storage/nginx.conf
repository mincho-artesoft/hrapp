server {
    listen 80;
    listen [::]:80;
    server_name storage.cloud-calendars.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://storage.cloud-calendars.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name storage.cloud-calendars.com;
    ssl_certificate /etc/letsencrypt/live/storage.cloud-calendars.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/storage.cloud-calendars.com/privkey.pem;
    access_log off;
    client_max_body_size 32m;
    location / { proxy_pass http://127.0.0.1:9467; }
}
