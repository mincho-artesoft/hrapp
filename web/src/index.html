<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>Cloud Calendars — Web Calendar &amp; iOS Weather</title>
  <meta name="description" content="Unify iCloud, Google Calendar and Microsoft Outlook on iPhone, iPad, and the web with hourly weather and widgets." />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark light" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem('cc_theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.colorScheme = t;
        }
      } catch (e) {}
    })();
  </script>
  <link rel="canonical" href="https://www.cloud-calendars.com/" />

  <!-- Social cards -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Cloud Calendars" />
  <meta property="og:title" content="Cloud Calendars — Web Calendar &amp; iOS Weather" />
  <meta property="og:description" content="Free web calendar synced with Google and Outlook, plus iPhone &amp; iPad calendars with hourly weather." />
  <meta property="og:url" content="https://www.cloud-calendars.com/" />
  <meta property="og:image" content="https://www.cloud-calendars.com/media/panel/site-assets-20261022/images/app-screenshots/single-day-view.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Apple -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-itunes-app" content="app-id=6744690319" />
  <meta name="google-adsense-account" content="ca-pub-3759868960530173" />

  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />

  <!-- Fonts are self-hosted and bundled with the stylesheet — no third-party request. -->

  <!-- The hero screenshot is the largest contentful paint on a wide viewport,
       so start it early there. On a phone the hero stacks and this image sits
       about 850px down — below a 745px fold — where a high-priority preload
       only competes with the bundle for bandwidth and moves LCP nowhere.
       Measured: LCP on mobile is text, at 596ms. -->
  <link rel="preload" as="image" href="/media/panel/site-assets-20261022/images/app-screenshots/single-day-view.webp"
        fetchpriority="high" media="(min-width: 900px)" />

  <!-- SoftwareApplication data is generated from app-facts.ts on home pages. -->

  <!-- The FAQPage markup is emitted by faq.component.ts, per language, from
       the same object the section renders. It used to be hand-copied here;
       when the FAQ was translated the copy stayed English, so twenty-nine
       pages carried English markup over translated prose. Generating it from
       the one source is the only arrangement where that cannot recur. -->

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YESHVTRYB1"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-YESHVTRYB1');
  </script>

  <style>
    /* Apply the saved theme before the main stylesheet loads. */
    html { background: #000000; }
    body { margin: 0; background: #000000; }
    html[data-theme='light'] { background: #f2f2f7; color-scheme: light; }
    html[data-theme='light'] body { background: #f2f2f7; }

  </style>
</head>

<body>
  <app-root></app-root>
</body>
</html>
