<section class="cta section" id="get">
  <div class="shell">
    <div class="card cta__card">
      <div class="cta__copy">
        <h2 class="cta__title">
          {{ copy().title[0] }}<br />
          <span class="grad-cyan">{{ copy().title[1] }}</span>
        </h2>

        <p class="cta__lead">{{ copy().lead }}</p>

        <div class="cta__actions">
          <a
            class="btn btn--primary btn--lg"
            [href]="appStoreUrl()"
            target="_blank"
            rel="noopener noreferrer"
          >
            <svg viewBox="0 0 384 512" aria-hidden="true" class="cta__apple">
              <path fill="currentColor" d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/>
            </svg>
            {{ storeCta() }}
          </a>
        </div>

        <ul class="cta__facts">
          <li><b>{{ rating }}★</b> {{ ratingsLine() }}</li>
          <li><b>{{ sizeMb }} MB</b> {{ copy().download }}</li>
          <li><b>iOS {{ minIos }}+</b> iPhone &amp; iPad</li>
        </ul>
      </div>

      <div class="cta__device">
        <app-device-frame
          size="md"
          [glow]="false"
          src="/media/panel/site-assets-20261022/images/app-screenshots/multi-day-view-v.webp"
          [alt]="copy().alt"
        />
      </div>
    </div>
  </div>
</section>
