<header class="hdr" [class.is-stuck]="isScrolled()">
  <div class="hdr__inner">
    <a class="brand" [href]="homePath()" (click)="closeMenu()" aria-label="Cloud Calendars — home">
      <img
        class="brand__mark"
        src="icons/mark-128.webp"
        alt=""
        width="32"
        height="32"
        decoding="async"
      />
      <span class="brand__text">Cloud Calendars</span>
    </a>

    <nav class="hdr__nav" aria-label="Primary">
      @for (item of nav(); track item.key) {
        <a
          class="hdr__link"
          [class.hdr__link--route]="item.isRoute"
          [class.is-active]="isActivePage(item.key)"
          [href]="item.href"
          (click)="followLink($event, item)"
          [attr.aria-current]="isActivePage(item.key) ? 'page' : null"
        >
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="hdr__actions">
      <button
        type="button"
        class="theme-btn"
        (click)="toggleTheme()"
        [attr.aria-label]="theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
        [attr.title]="theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
      >
        <span class="theme-btn__icon" aria-hidden="true">{{ theme() === 'dark' ? '☀' : '☾' }}</span>
        <span class="theme-btn__label">{{ theme() === 'dark' ? 'Light' : 'Dark' }}</span>
      </button>

      <app-language-switcher />

      <a
        class="btn btn--primary hdr__cta"
        [class.hdr__cta--secondary]="pageAction()"
        [href]="appStoreUrl()"
        target="_blank"
        rel="noopener noreferrer"
      >
        {{ copy().nav.getApp }}
      </a>
      @if (pageAction(); as action) {
        <ng-container [ngTemplateOutlet]="action" />
      }

      <button
        class="hdr__burger"
        type="button"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="mobile-nav"
        [attr.aria-label]="copy().nav.menu"
        (click)="toggleMenu()"
      >
        <span [class.is-open]="menuOpen()"></span>
      </button>
    </div>
  </div>
</header>

<!-- Mobile sheet -->
<div
  id="mobile-nav"
  class="sheet"
  [class.is-open]="menuOpen()"
  [attr.inert]="menuOpen() ? null : ''"
>
  <div class="sheet__card">
    <nav class="sheet__nav" aria-label="Mobile">
      @for (item of nav(); track item.key) {
        <a
          class="sheet__link"
          [attr.aria-current]="isActivePage(item.key) ? 'page' : null"
          [href]="item.href"
          (click)="followLink($event, item)"
        >
          <span>{{ item.label }}</span>
          <span class="sheet__chev" aria-hidden="true">›</span>
        </a>
      }
    </nav>

    <a
      class="btn btn--primary btn--lg sheet__cta"
      [href]="appStoreUrl()"
      target="_blank"
      rel="noopener noreferrer"
      (click)="closeMenu()"
    >
      {{ storeCta() }}
    </a>
  </div>
</div>
